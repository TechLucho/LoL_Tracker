name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest + Postgres efímero)
    runs-on: ubuntu-latest
    # Postgres efímero para los tests de integración de repositories/ (auditoría 🔴):
    # migraciones aplicadas en orden antes de pytest y datos truncados por escenario.
    # Cero riesgo de fuga: nunca toca el Supabase real.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lol_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # GitHub ya exporta CI=true; se fija explícito como documentación del contrato con
      # backend/tests/conftest.py (rama de credenciales del Postgres efímero).
      CI: "true"
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lol_tracker_test
      # El servicio efímero no lleva TLS: sin esto, el pool (sslmode=require por defecto)
      # rechazaría la conexión.
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      # Migraciones versionadas en orden, igual que en producción pero contra la DB efímera.
      # Sin este paso los tests de integración morirían por tablas inexistentes.
      - name: Aplicar migraciones (backend/migrations/*.sql)
        run: |
          python - <<'PY'
          import glob, os, psycopg
          dsn = os.environ["TEST_DATABASE_URL"]
          with psycopg.connect(dsn, autocommit=True) as conn:
              for path in sorted(glob.glob("backend/migrations/*.sql")):
                  print(f"-> aplicando {path}")
                  conn.execute(open(path, encoding="utf-8").read())
          PY

      # Herméticos (conftest.py stubs credenciales) + integración (tests/integration/ usa
      # TEST_DATABASE_URL). En local sin Postgres, integration/ se salta entera.
      - name: Tests
        run: pytest backend/tests -q

  frontend:
    name: Frontend (oxlint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Linter
        run: npm run lint

      # Unitarios puros (insights + mapeo legacy): sin red, sin DOM, herméticos como pytest.
      - name: Tests unitarios (vitest)
        run: npm run test

      # Build real de producción (incluye tsc -b): era el hueco que señalaba la auditoría.
      - name: Build
        run: npm run build
